version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: comic_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DB_NAME:-comic}
      MYSQL_USER: ${MYSQL_USERNAME:-comic_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-comic_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - comic_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: comic_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - MYSQL_URL=mysql
      - MYSQL_PORT=3306
      - MYSQL_DB_NAME=${MYSQL_DB_NAME:-comic}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-comic_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-comic_pass}
      - PORT_SERVER_RUN=8000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - comic_network
    volumes:
      - ./logs:/app/logs

  # Frontend Next.js
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: comic_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT_API=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - comic_network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: comic_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - comic_network

volumes:
  mysql_data:
    driver: local

networks:
  comic_network:
    driver: bridge
